services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15
    container_name: vaa_postgres
    environment:
      POSTGRES_USER: markn
      POSTGRES_PASSWORD: "0605"
      POSTGRES_DB: vaa_chat_mem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Ollama with GPU support
  ollama:
    image: ollama/ollama:latest
    container_name: vaa_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 3. Python Application
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: vaa_app
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - DB_URI=${DB_URI}
      - CHROMA_DB_PATH=${CHROMA_DB_PATH}
      - SINGLE_COLLECTION=${SINGLE_COLLECTION}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - COLBERT_GPU=${COLBERT_GPU}
      - USE_COLBERT=${USE_COLBERT}
    ports:
      - "7860:7860"
    volumes:
      - ./APP/chroma_db:/app/APP/chroma_db
    depends_on:
      db:
        condition: service_started
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_models:
